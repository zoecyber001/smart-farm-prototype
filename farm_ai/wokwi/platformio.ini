; PlatformIO build for the Wokwi simulation of the Smart Farm field node.
; Builds the SAME sketch.ino that runs on wokwi.com (src/wokwi.ino is a hard
; link to sketch.ino - always edit sketch.ino, never src/wokwi.ino).
;
; After `pio run`, flash the built app:
;   .pio/build/esp32dev/firmware.bin  (+ firmware.elf)  via wokwi.toml -> VS Code
;   press F1 -> "Wokwi: Start Simulator" and the OLED/leds/serial come up.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit SSD1306@^2.5.10
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.4
